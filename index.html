<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
</head>

<body>
    <section id="start-screen">
        <div class="container">
            <div class="start-screen-content">

                <div class="trophy-badge">
                    <img src="/assets/achievement-award-medal-icon.svg" alt="award-medal-icon">
                </div>

                <div class="content-title">
                    <h1>JavaScript Quiz</h1>
                    <p>Test your JavaScript knowledge</p>
                </div>

                <div class="quiz-details">
                    <h2>Quiz Details</h2>

                    <ul class="custom-list">
                        <li><span></span>Test your knowledge of JavaScript</li>
                        <li><span></span>Multiple choice answers</li>
                        <li><span></span>Instant feedback</li>
                        <li><span></span>Track your score</li>
                    </ul>
                </div>

                <button id="start-btn">
                    <span>Start quiz</span>
                    <img src="/assets/Right-arrow-icon.svg" alt="Right-arrow-icon">
                </button>
            </div>
        </div>
    </section>
    
    <section id="quiz-screen" class="hidden">
        <div class="container">
            <div class="quiz-screen-content">

                <div class="main-content">
                    <div class="quiz-header">

                        <div class="progress-details">
                            <span id="progress-text"></span>
                            <div id="progress-percent"></div>
                        </div>

                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                    </div>
                    
                    <div class="quiz-questions">
                        <h2 id="question"></h2>

                        <div id="answers"></div>

                    </div>
                </div>

                <div class="quiz-nav">
                    <button id="previous-btn">
                        <img src="/assets/Left-arrow-icon.svg" alt="Left-arrow-icon">
                        <span>Previous</span>
                    </button>

                    <button id="next-btn">
                        <span>Next</span>
                        <img src="/assets/Right-arrow-icon.svg" alt="">
                    </button>
                </div>
            </div>
        </div>
    </section>


    <section id="result-screen" class="hidden">
        <div class="container">
            <div class="result-screen-content">
                
                <div class="card-header">
                    <img class="confetti" src="/assets/Confetti.svg" alt="Confetti-icon">
                    
                    <div class="header-title">
                        <h2>Quiz Complete!</h2>
                        <p class="subtitle">Good Effort!</p>
                    </div>
                </div>


                <div class="score-box">
                    <div class="score-top">
                        <h3 id="correct-answers"></h3>
                        <span>Correct Answers</span>
                    </div>

                    <div class="divider"></div>

                    <div class="score-bottom">
                        <h3 class="percentage" id="percentage"></h3>
                        <span>Score</span>
                    </div>
                </div>


                <div class="stats">
                    <div class="stat-card attempted">
                        <img src="/assets/target-01.svg" alt="">
                        <span>Attempted</span>
                        <strong id="attempted"></strong>
                    </div>

                    <div class="stat-card correct">
                        <img src="/assets/award-04.svg" alt="">
                        <span>Correct</span>
                        <strong id="correct"></strong>
                    </div>

                    <div class="stat-card wrong">
                        <img src="/assets/cancel-circle.svg" alt="">
                        <span>Wrong</span>
                        <strong id="wrong"></strong>
                    </div>
                </div>

                <button id="try-again" onclick="restartQuiz()">
                    <img src="/assets/refresh.svg" alt="refresh-icon">
                    <span>Try Again</span>
                </button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
